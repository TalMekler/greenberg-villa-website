    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One request. Google serves each face with a unicode-range, so a visitor
      only downloads the files for the script they are actually reading.
      Cormorant Garamond + Source Sans 3 for English, Frank Ruhl Libre +
      Assistant for Hebrew, GFS Didot + Source Sans 3 for Greek.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600;700&family=GFS+Didot&display=swap"
      rel="stylesheet"
    />
    <title>Greenberg Villa — Private Retreat on Evia Island, Greece</title>
  </head>

    <div id="root"></div>
