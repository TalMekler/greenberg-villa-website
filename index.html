<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Green Villa — a private Mediterranean escape on the island of Evia, Greece. Four bedrooms, heated infinity pool and 180° sea views."
    />
    <script>
      /*
        Runs before the body is parsed, so the very first frame is already in
        the right language and the right direction. Deciding this later meant a
        Hebrew visitor watched the page flip from left-to-right a moment in.

        The admin is English-only and is pinned here too, rather than showing
        Hebrew for an instant on the way in.
      */
      (function () {
        var supported = { en: "ltr", he: "rtl", el: "ltr" };
        var lang = "en";
        try {
          var stored = localStorage.getItem("greenberg-villa:language");
          if (stored && supported[stored]) lang = stored;
        } catch (error) {
          /* private browsing — English it is */
        }
        // A language in the path (/he/privacy) wins: it is what the link asked for.
        var fromPath = /^\/(en|he|el)(\/|$)/.exec(location.pathname);
        if (fromPath) lang = fromPath[1];
        if (location.pathname.indexOf("/admin") === 0) lang = "en";

        document.documentElement.lang = lang;
        document.documentElement.dir = supported[lang];
      })();
    </script>
    <title>Green Villa — Private Retreat on Evia Island, Greece</title>
  </head>
  <body>
    <!--
      The loading cover, in the document itself.

      As a React component it could not appear until the bundle had downloaded
      and run — half a second of blank white page first, on a fast desktop
      connection, which is most of what a visitor saw. Here it paints with the
      first frame. React's own Loader renders on top of it, looking identical,
      and removes this one as it mounts.

      Styles are inline on purpose: the stylesheet is a separate request, and
      anything waiting on it would reintroduce the flash this exists to remove.
    -->
    <div
      id="boot-loader"
      style="
        position: fixed;
        inset: 0;
        z-index: 59;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: #1b3a5c;
        font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
      "
    >
      <p style="margin: 0; font-size: 44px; color: #fff">Green Villa</p>
      <div style="height: 1px; width: 14rem; overflow: hidden; background: #2a4e70">
        <div id="boot-loader-bar" style="height: 100%; width: 33%; background: #c97d60"></div>
      </div>
      <p id="boot-loader-message">
        <span lang="en">Preparing your escape</span>
        <span lang="he">מכינים עבורכם את הווילה</span>
        <span lang="el">Ετοιμάζουμε την απόδρασή σας</span>
      </p>
    </div>
    <style>
      #boot-loader-message {
        margin: 0;
        font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(244, 239, 230, 0.7);
      }
      /* One line is shown, chosen by the language the head script already set —
         so there is never a frame with the wrong one, or with none. */
      #boot-loader-message span { display: none; }
      :root[lang="en"] #boot-loader-message span[lang="en"],
      :root[lang="he"] #boot-loader-message span[lang="he"],
      :root[lang="el"] #boot-loader-message span[lang="el"] { display: inline; }
      /* Letter-spacing is a Latin and Greek device; it only pulls Hebrew apart. */
      :root[lang="he"] #boot-loader-message { letter-spacing: normal; }

      @keyframes boot-loader-sweep {
        from { inset-inline-start: -33%; }
        to { inset-inline-start: 100%; }
      }
      #boot-loader-bar { position: relative; animation: boot-loader-sweep 1.1s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader-bar { inset-inline-start: 0; width: 100%; animation: none; }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
